<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>DNM Schedule</title>
  <meta name="theme-color" content="#FFDCE4">
  <meta name="robots" content="noindex">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" type="image/png" href="icons/icon-192.png">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="DNM Schedule">
  <link rel="preload" href="fonts/bogart-extrabold.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Inter:wght@400;500;600&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header class="top">
    <img class="mark" src="icons/flower.png" alt="" width="44" height="44">
    <div>
      <h1>DNM Schedule</h1>
      <p class="meta" id="meta"><span>Residencia legal</span> · <span id="updated">loading…</span></p>
    </div>
  </header>

  <div class="tabs" role="tablist" aria-label="Schedules">
    <button type="button" role="tab" id="tab-res" aria-controls="panel-res" aria-selected="true">Residency</button>
    <button type="button" role="tab" id="tab-rc" aria-controls="panel-rc" aria-selected="false" tabindex="-1">Registro Civil</button>
  </div>

  <section id="panel-res" role="tabpanel" aria-labelledby="tab-res">
    <p class="legend" aria-label="Pill colors">
      <span class="dot soon"></span>within 30 days
      <span class="dot mid"></span>within 60
      <span class="dot later"></span>later
    </p>
    <div id="list" aria-live="polite"></div>
    <p class="foot">From DNM's public calendar, checked every hour.</p>
  </section>

  <section id="panel-rc" role="tabpanel" aria-labelledby="tab-rc" hidden>
    <div id="rc-list" aria-live="polite"></div>
    <p class="foot">Foreign birth certificate registration at Uruguay 933, checked every 10 minutes.</p>
  </section>

  <script src="app.js"></script>
</body>
</html>
